bind -n C-w switch-client -T w

bind -T w h select-pane -L
bind -T w j select-pane -D
bind -T w k select-pane -U
bind -T w l select-pane -R
bind -T w C-w send-keys C-w

set -g base-index 1


# Forward mouse wheel to apps that ask for it (Claude Code fullscreen scrolling);
# in other panes the wheel scrolls tmux history instead.
set -g mouse on
